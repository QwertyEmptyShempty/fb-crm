services:
  - type: web
    name: fb-tg-crm
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fb-tg-crm-db
          property: connectionString
      - key: PUBLIC_URL
        sync: false # https://<ваш-домен> — укажите после первого деплоя
      - key: API_KEYS
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false # пароль входа в панель, минимум 8 символов
      - key: ADMIN_LOGIN
        value: admin
      - key: DEFAULT_TZ
        value: Asia/Ho_Chi_Minh

databases:
  - name: fb-tg-crm-db
    plan: basic-256mb
